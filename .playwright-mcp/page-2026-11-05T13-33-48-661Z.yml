          - button "Do you offer bridal and event packages?" [ref=f42e88]
          - paragraph [ref=f42e93]: We do — bridal packages include a trial run, hair, makeup and touch-ups on the day itself.
        - listitem [ref=f42e94]:
          - button "Is parking available near the salon?" [ref=f42e95]
          - paragraph [ref=f42e100]: There is free street parking after 6pm and a paid car park directly opposite the entrance.
        - listitem [ref=f42e101]:
          - button "Do you sell the products used in the salon?" [ref=f42e102]
          - paragraph [ref=f42e107]: Yes, everything we use during a treatment is available to purchase at our reception counter and online shop.
        - listitem [ref=f42e108]:
          - button "Can I request a specific stylist?" [ref=f42e109]
          - paragraph [ref=f42e114]: Of course. Just mention their name when you book and we will match you with them where possible.
        - listitem [ref=f42e115]:
          - button "Do you have a loyalty or referral programme?" [ref=f42e116]
          - paragraph [ref=f42e121]: Returning clients earn points on every visit, and referrals receive 20% off their next treatment.
