          - heading "F.A.Qs" [level=2] [ref=f42e35]
        - paragraph [ref=f42e37]: Everything you might want to know before your first visit. Can't find an answer? Get in touch and we'll reply the same day.
      - list [ref=f42e39]:
        - listitem [ref=f42e40]:
          - button "What services does your beauty salon offer?" [expanded] [ref=f42e41]
          - paragraph [ref=f42e48]: We offer haircutting, styling, skin care treatments, makeup application, manicures, pedicures and a full range of spa therapies for men and women.
        - listitem [ref=f42e49]:
          - button "Do I need an appointment or can I walk in?" [ref=f42e50]
          - paragraph [ref=f42e55]: Walk-ins are welcome, though we recommend booking ahead so you can secure your preferred stylist and time slot.
        - listitem [ref=f42e56]:
          - button "How long does a typical treatment take?" [ref=f42e57]
          - paragraph [ref=f42e62]: A standard haircut takes around 45 minutes, while facials and full spa packages can take between 60 and 120 minutes.
        - listitem [ref=f42e63]:
          - button "Are your products cruelty free?" [ref=f42e64]
          - paragraph [ref=f42e69]: Yes. Every product on our shelves is cruelty free and many are also vegan and paraben free.
        - listitem [ref=f42e70]:
          - button "What is your cancellation policy?" [ref=f42e71]
          - paragraph [ref=f42e76]: Please give us at least 24 hours notice so the slot can be released to another client. Late cancellations may be charged 50%.
    - generic [ref=f42e78]:
